<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSD QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 25px 15px;
      background: #f5f5f5;
    }
    h1 { font-size: 24px; }
    #reader {
      max-width: 450px;
      margin: 25px auto;
      background: white;
    }
    #status {
      font-size: 18px;
      margin: 20px auto;
      max-width: 450px;
    }
    button {
      padding: 14px 25px;
      font-size: 17px;
      cursor: pointer;
    }
    .creator-credit {
  position: fixed;
  top: 5px;
  right: 6px;
  font-size: 7px;
  color: rgba(120, 120, 120, 0.35);
  font-weight: 400;
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap;
}
  </style>
</head>
<body>
  <div class="creator-credit">
  Created by Vijay Sharma on 28 October 2026
</div>
  <h1>Sanatan Seva Denmark</h1>
  <h2>QR Check-in Scanner</h2>
<div id="loginSection">
  <h3>Login</h3>

  <input
    type="password"
    id="volunteerPassword"
    placeholder="Indtast adgangskode"
    autocomplete="off"
    style="padding:12px; font-size:17px; width:220px;"
  >

  <br><br>

  <button onclick="volunteerLogin()">
    Log ind
  </button>
</div>
  <button id="startButton" onclick="startScanner()">
    Start kamera
  </button>


<div id="reader"></div>
<div id="status">Klar til scanning</div>

<div id="manualSection" style="display:none;">
  <h3>Manual Check-in</h3>

  <form id="manualForm" autocomplete="off">
    <input
      id="manualCode"
      type="text"
      inputmode="numeric"
      pattern="[0-9]{4}"
      maxlength="4"
      placeholder="4-digit booking number"
      aria-label="4-digit booking number"
      required
      style="
        padding:12px;
        font-size:20px;
        width:190px;
        max-width:65%;
        box-sizing:border-box;
        text-align:center;
        letter-spacing:4px;
      "
    >

    <button type="submit">Check In</button>
  </form>
</div>

  <script>
    async function testConnection() {
  const url = "https://script.google.com/macros/s/AKfycbwrhkU0ePzD8Lu_IMsmObmBZKifKkjRolSIuY4Rn8zE38EBT3d-8ue5TEZ8DeBi5xfz/exec";

  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({ action: "connection_test" })
    });

    alert("Testforespørgsel sendt. Svaret kan ikke læses endnu.");
  } catch (error) {
    alert("Forbindelsesfejl: " + error.message);
  }
}
    function testJsonpConnection() {
  const status = document.getElementById("status");
  status.textContent = "Tester forbindelse...";

  const callbackName = "ssdConnectionCallback";

  window[callbackName] = function(result) {
    status.textContent = result.success
      ? "Forbindelse til Google Apps Script virker!"
      : "Forbindelsen fejlede.";

    document.getElementById("jsonpTestScript")?.remove();
    delete window[callbackName];
  };

  const script = document.createElement("script");
  script.id = "jsonpTestScript";

  script.src =
    "https://script.google.com/macros/s/AKfycbwrhkU0ePzD8Lu_IMsmObmBZKifKkjRolSIuY4Rn8zE38EBT3d-8ue5TEZ8DeBi5xfz/exec" +
    "?action=scannerPing&callback=" + callbackName;

  script.onerror = function() {
    status.textContent = "Kunne ikke modtage svar.";
  };

  document.body.appendChild(script);
}
    const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwrhkU0ePzD8Lu_IMsmObmBZKifKkjRolSIuY4Rn8zE38EBT3d-8ue5TEZ8DeBi5xfz/exec";

let volunteerSession = null;

async function volunteerLogin() {
  const password = document.getElementById("volunteerPassword").value;
  const status = document.getElementById("status");

  if (!password) {
    status.textContent = "Indtast adgangskoden.";
    return;
  }

  const requestId = crypto.randomUUID();

  status.textContent = "Logger ind...";

  try {
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "volunteerLogin",
        password: password,
        requestId: requestId
      })
    });

    checkLoginResult(requestId, 0);

  } catch (error) {
    status.textContent = "Kunne ikke kontakte serveren.";
  }
}

function checkLoginResult(requestId, attempt) {
  if (attempt >= 10) {
    document.getElementById("status").textContent =
      "Login tog for lang tid. Prøv igen.";
    return;
  }

  const callbackName = "ssdLoginCallback";
  const script = document.createElement("script");

  window[callbackName] = function(result) {
    script.remove();
    delete window[callbackName];

    if (result.pending) {
      setTimeout(() => checkLoginResult(requestId, attempt + 1), 1000);
      return;
    }

    if (result.success) {
      volunteerSession = result.sessionToken;
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("manualSection").style.display = "block";
      document.getElementById("status").textContent =
        "Login lykkedes. Klar til scanning.";
    } else {
      document.getElementById("status").textContent =
        "Forkert adgangskode.";
    }
  };

  script.src = WEB_APP_URL +
    "?action=loginResult" +
    "&requestId=" + encodeURIComponent(requestId) +
    "&callback=" + callbackName;

  script.onerror = function() {
    script.remove();
    document.getElementById("status").textContent =
      "Kunne ikke hente loginresultatet.";
  };

  document.body.appendChild(script);
}
    let scanBusy = false;

async function processQrCode(decodedText) {
  if (scanBusy || manualBusy || !volunteerSession) return;

  let token;

  try {
    token = new URL(decodedText).searchParams.get("checkin");
  } catch {
    document.getElementById("status").textContent =
      "Ugyldig QR-kode.";
    return;
  }

  if (!token) {
    document.getElementById("status").textContent =
      "Dette er ikke en SSD-billet.";
    return;
  }

  scanBusy = true;
  document.getElementById("status").textContent =
    "Kontrollerer booking...";

  const requestId = crypto.randomUUID();

  try {
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "volunteerCheckIn",
        token: token,
        sessionToken: volunteerSession,
        requestId: requestId
      })
    });

    checkQrResult(requestId, 0);

  } catch (error) {
    document.getElementById("status").textContent =
      "Forbindelsesfejl.";
    scanBusy = false;
  }
}

function checkQrResult(requestId, attempt) {
  if (attempt >= 15) {
    document.getElementById("status").textContent =
      "Intet svar fra serveren. Kontroller Dashboard.";
    scanBusy = false;
    return;
  }

  const callbackName = "ssdQrResultCallback";
  const script = document.createElement("script");

  window[callbackName] = function(result) {
    script.remove();
    delete window[callbackName];

    if (result.pending) {
      setTimeout(() => checkQrResult(requestId, attempt + 1), 300);
      return;
    }

    if (result.success) {
      document.getElementById("status").textContent =
        "ANKOMMET: " + result.bookingId +
        " | " + result.leadGuest +
        " | " + result.totalGuests + " gæster";
    } else {
      document.getElementById("status").textContent =
        result.message || "Check-in afvist.";
    }

scanBusy = false;
  };

  script.src = WEB_APP_URL +
    "?action=checkInResult" +
    "&requestId=" + encodeURIComponent(requestId) +
    "&callback=" + callbackName;

  script.onerror = function() {
    script.remove();
    document.getElementById("status").textContent =
      "Kunne ikke hente check-in-resultatet.";
    scanBusy = false;
  };

  document.body.appendChild(script);
}
    let manualBusy = false;

document.getElementById("manualForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!volunteerSession || manualBusy || scanBusy) return;

    const input = document.getElementById("manualCode");
    const code = input.value.trim();

    if (!/^\d{4}$/.test(code)) {
      document.getElementById("status").textContent =
        "Enter a valid 4-digit booking number.";
      return;
    }

    manualBusy = true;
    scanBusy = true;

    document.getElementById("status").textContent =
      "Checking booking...";

    const requestId = crypto.randomUUID();

    try {
      await fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "manualCheckIn",
          code: code,
          sessionToken: volunteerSession,
          requestId: requestId
        })
      });

      checkManualResult(requestId, 0);

    } catch (error) {
      document.getElementById("status").textContent =
        "Connection error.";
      manualBusy = false;
      scanBusy = false;
    }
  });

function checkManualResult(requestId, attempt) {
  if (attempt >= 30) {
    document.getElementById("status").textContent =
      "No response. Check Dashboard before retrying.";
    manualBusy = false;
    scanBusy = false;
    return;
  }

  const callbackName = "ssdManualResultCallback";
  const script = document.createElement("script");

  window[callbackName] = function(result) {
    script.remove();
    delete window[callbackName];

    if (result.pending) {
      setTimeout(() => checkManualResult(requestId, attempt + 1), 500);
      return;
    }

    if (result.success) {
      document.getElementById("status").textContent =
        "ANKOMMET: " + result.bookingId +
        " | " + result.leadGuest +
        " | " + result.totalGuests + " gæster";

      const input = document.getElementById("manualCode");
      input.value = "";
      input.focus();

    } else {
      document.getElementById("status").textContent =
        result.message || "Check-in rejected.";
    }

    manualBusy = false;
    scanBusy = false;
  };

  script.src = WEB_APP_URL +
    "?action=checkInResult" +
    "&requestId=" + encodeURIComponent(requestId) +
    "&callback=" + callbackName;

  script.onerror = function() {
    script.remove();
    document.getElementById("status").textContent =
      "Could not retrieve check-in result.";
    manualBusy = false;
    scanBusy = false;
  };

  document.body.appendChild(script);
}
    let scanner;
    let scanning = false;

    async function startScanner() {
      if (scanning) return;

      document.getElementById("status").textContent =
        "Starter kamera...";

      scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          { facingMode: "environment" },
{
  fps: 20,
  qrbox: (viewfinderWidth, viewfinderHeight) => {
    const size = Math.floor(
      Math.min(viewfinderWidth, viewfinderHeight) * 0.85
    );

    return {
      width: size,
      height: size
    };
  },
  aspectRatio: 1.0,
  disableFlip: true,
  experimentalFeatures: {
    useBarCodeDetectorIfSupported: true
  }
},
          (decodedText) => {
  processQrCode(decodedText);
},
          () => {}
        );

        scanning = true;
        document.getElementById("startButton").style.display = "none";
        document.getElementById("status").textContent =
          "Kamera aktivt – klar til scanning";

      } catch (error) {
        document.getElementById("status").textContent =
          "Kunne ikke starte kamera: " + error;
      }
    }
  </script>
</body>
</html>
