<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSD QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 25px 15px;
      background: #f5f5f5;
    }
    h1 { font-size: 24px; }
    #reader {
      max-width: 450px;
      margin: 25px auto;
      background: white;
    }
    #status {
      font-size: 18px;
      margin: 20px auto;
      max-width: 450px;
    }
    button {
      padding: 14px 25px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Sanatan Seva Denmark</h1>
  <h2>QR Check-in Scanner</h2>
<div id="loginSection">
  <h3>Frivilliglogin</h3>

  <input
    type="password"
    id="volunteerPassword"
    placeholder="Indtast adgangskode"
    autocomplete="off"
    style="padding:12px; font-size:17px; width:220px;"
  >

  <br><br>

  <button onclick="volunteerLogin()">
    Log ind
  </button>
</div>
  <button id="startButton" onclick="startScanner()">
    Start kamera
  </button>
<button onclick="testConnection()">Test forbindelse</button>
  <button onclick="testJsonpConnection()">Test svar fra Google</button>
  <div id="reader"></div>
  <div id="status">Klar til scanning</div>

  <script>
    async function testConnection() {
  const url = "https://script.google.com/macros/s/AKfycbwrhkU0ePzD8Lu_IMsmObmBZKifKkjRolSIuY4Rn8zE38EBT3d-8ue5TEZ8DeBi5xfz/exec";

  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({ action: "connection_test" })
    });

    alert("Testforespørgsel sendt. Svaret kan ikke læses endnu.");
  } catch (error) {
    alert("Forbindelsesfejl: " + error.message);
  }
}
    function testJsonpConnection() {
  const status = document.getElementById("status");
  status.textContent = "Tester forbindelse...";

  const callbackName = "ssdConnectionCallback";

  window[callbackName] = function(result) {
    status.textContent = result.success
      ? "Forbindelse til Google Apps Script virker!"
      : "Forbindelsen fejlede.";

    document.getElementById("jsonpTestScript")?.remove();
    delete window[callbackName];
  };

  const script = document.createElement("script");
  script.id = "jsonpTestScript";

  script.src =
    "https://script.google.com/macros/s/AKfycbwrhkU0ePzD8Lu_IMsmObmBZKifKkjRolSIuY4Rn8zE38EBT3d-8ue5TEZ8DeBi5xfz/exec" +
    "?action=scannerPing&callback=" + callbackName;

  script.onerror = function() {
    status.textContent = "Kunne ikke modtage svar.";
  };

  document.body.appendChild(script);
}
    let scanner;
    let scanning = false;

    async function startScanner() {
      if (scanning) return;

      document.getElementById("status").textContent =
        "Starter kamera...";

      scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            document.getElementById("status").textContent =
              "QR-kode læst. Check-in er endnu ikke aktiveret.";
            console.log("QR scanned");
          },
          () => {}
        );

        scanning = true;
        document.getElementById("startButton").style.display = "none";
        document.getElementById("status").textContent =
          "Kamera aktivt – klar til scanning";

      } catch (error) {
        document.getElementById("status").textContent =
          "Kunne ikke starte kamera: " + error;
      }
    }
  </script>
</body>
</html>
